---
- name: Infrastructure Smoke Test
  hosts: debian-docker
  gather_facts: no
  tasks:
    - name: Ping the host
      ansible.builtin.ping:

    - name: Check host uptime and OS
      ansible.builtin.command: "uptime"
      register: uptime_output

    - name: Print uptime result
      ansible.builtin.debug:
        msg: "The host has been up for: {{ uptime_output.stdout }}"